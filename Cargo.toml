[package]
name = "statico"
version = "0.1.0"
edition = "2024"
description = "Static code analyzer for TypeScript projects"

[features]
default = []
deep-resolution = []  # Trace re-export chains for better unused export accuracy

[[bin]]
name = "statico"
path = "src/main.rs"

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"
rayon = "1.10"
regex = "1"
tree-sitter = "0.24"
tree-sitter-typescript = "0.23"
indicatif = "0.17"
colored = "3"
atty = "0.2"

[[bench]]
name = "analysis_benchmarks"
harness = false

