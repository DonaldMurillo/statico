[package]
name = "statico"
version = "0.1.0"
edition = "2024"
description = "Static code analyzer for TypeScript and Rust projects"

[features]
default = []
deep-resolution = ["dep:oxc_resolver"]  # Use oxc_resolver for proper TS module resolution

[[bin]]
name = "statico"
path = "src/main.rs"

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
tiny_http = "0.2"

[dependencies]
clap = { version = "4", features = ["derive", "color", "unstable-styles"] }
clap_complete = "4"
git-version = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"
rayon = "1.10"
regex = "1"
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
indicatif = "0.17"
colored = "3"
atty = "0.2"
oxc_resolver = { version = "11", optional = true }
tree-sitter-rust = "0.24"
ureq = { version = "3", features = ["json"] }
flate2 = "1"
zstd = "0.13"
tar = "0.4"
sha2 = "0.10"
dirs = "6"
tempfile = "3"

[[bench]]
name = "analysis_benchmarks"
harness = false

