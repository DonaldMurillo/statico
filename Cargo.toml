[package]
name = "statico"
version = "0.1.5"
edition = "2024"
rust-version = "1.91"
description = "Customizable, AI-forward static analyzer for TypeScript and Rust projects (early alpha)"
authors = ["Donald Murillo <donald.murillo07@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/DonaldMurillo/statico"
homepage = "https://github.com/DonaldMurillo/statico"
documentation = "https://github.com/DonaldMurillo/statico#readme"
readme = "README.md"
keywords = ["static-analysis", "dead-code", "linter", "typescript", "rust"]
categories = ["development-tools", "command-line-utilities"]
exclude = [
    "/website",
    "/benchmarks",
    "/fixtures",
    "/examples",
    "/docs",
    "/.github",
    "/.claude",
    "/.cursor",
    "/.pi",
    "/.statico",
    "/__pycache__",
    "/target",
    "/install",
    "/npm",
    "/scripts",
    "/sdks",
    # CLAUDE.md and CONTRIBUTING.md are dev-process docs, not part of the
    # crate API. The README, LICENSEs, CHANGELOG, SECURITY policy, and the
    # `templates/` markdown (compiled in via include_str!) all stay.
    "/CLAUDE.md",
    "/CONTRIBUTING.md",
]

[features]
default = []
deep-resolution = ["dep:oxc_resolver"]  # Use oxc_resolver for proper TS module resolution

[[bin]]
name = "statico"
path = "src/main.rs"

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
tiny_http = "0.12"

[dependencies]
clap = { version = "4", features = ["derive", "color", "unstable-styles"] }
clap_complete = "4"
git-version = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"
rayon = "1.10"
regex = "1"
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
indicatif = "0.17"
colored = "3"
oxc_resolver = { version = "11", optional = true }
tree-sitter-rust = "0.24"
ureq = { version = "3", features = ["json"] }
flate2 = "1"
zstd = "0.13"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
dirs = "6"
tempfile = "3"
notify = { version = "6", default-features = false, features = ["macos_kqueue"] }

[[bench]]
name = "analysis_benchmarks"
harness = false