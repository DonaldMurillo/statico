name: 'statico'
description: 'Run statico static code analysis and (optionally) upload SARIF to GitHub code scanning.'
author: 'statico contributors'

branding:
  icon: 'search'
  color: 'orange'

inputs:
  version:
    description: 'statico release tag to install (e.g. "v0.1.0"). "latest" pulls the most recent release.'
    required: false
    default: 'latest'
  path:
    description: 'Project path to analyze.'
    required: false
    default: '.'
  format:
    description: 'Output format passed to `statico analyze`. Defaults to "sarif" so the result can be uploaded to code scanning.'
    required: false
    default: 'sarif'
  output-file:
    description: 'File to write the analysis output to.'
    required: false
    default: 'statico-results.sarif'
  min-confidence:
    description: 'Minimum confidence threshold (0.0–1.0).'
    required: false
    default: '0.0'
  exit-code:
    description: 'If "true", fail the step when issues are found above min-confidence.'
    required: false
    default: 'false'
  upload-sarif:
    description: 'If "true" (and format is sarif), upload the result to GitHub code scanning. Requires `security-events: write` permission.'
    required: false
    default: 'true'

outputs:
  output-file:
    description: 'Path to the analysis output file.'
    value: ${{ steps.run.outputs.output-file }}

runs:
  using: composite
  steps:
    - name: Install statico
      shell: bash
      env:
        STATICO_VERSION: ${{ inputs.version }}
        # `RUNNER_OS` is set by GitHub Actions on every runner — use it
        # for the OS detection so the Windows-vs-macOS-vs-Linux split is
        # unambiguous (uname under Git Bash on Windows reports MINGW64_NT
        # which is awkward to match).
        RUNNER_OS: ${{ runner.os }}
      run: |
        set -euo pipefail

        case "$RUNNER_OS" in
          macOS)   os=macos ;;
          Linux)   os=linux ;;
          Windows) os=windows ;;
          *) echo "::error::unsupported runner OS: $RUNNER_OS"; exit 1 ;;
        esac

        arch="$(uname -m)"
        case "$arch" in
          arm64|aarch64) arch=aarch64 ;;
          x86_64|amd64)  arch=x86_64 ;;
          *) echo "::error::unsupported arch: $arch"; exit 1 ;;
        esac

        version="${STATICO_VERSION#v}"
        if [ "$version" = "latest" ]; then
          tag_path="latest/download"
        else
          tag_path="download/v${version}"
        fi
        url="https://github.com/DonaldMurillo/statico/releases/${tag_path}/statico-${os}-${arch}.tar.gz"
        echo "Downloading $url"

        # Stage in a runner-agnostic temp dir. RUNNER_TEMP is provided by
        # GitHub on every OS and avoids `/tmp` permission quirks on
        # Windows (where /tmp maps oddly under Git Bash).
        stage="${RUNNER_TEMP:-/tmp}/statico-install"
        mkdir -p "$stage"
        curl -fsSL "$url" -o "$stage/statico.tar.gz"

        # Pick the binary name + install dir per OS. Windows install
        # goes into RUNNER_TEMP and we add it to $GITHUB_PATH; the
        # POSIX path uses /usr/local/bin.
        if [ "$os" = "windows" ]; then
          bin=statico.exe
          tar -xzf "$stage/statico.tar.gz" -C "$stage" \
            --no-same-owner --no-same-permissions "./$bin"
          mv "$stage/$bin" "$stage/$bin"   # already there; explicit for clarity
          echo "$stage" >>"$GITHUB_PATH"
          "$stage/$bin" --version
        else
          bin=statico
          tar -xzf "$stage/statico.tar.gz" -C "$stage" \
            --no-same-owner --no-same-permissions "./$bin"
          sudo install -m 0755 "$stage/$bin" "/usr/local/bin/$bin"
          statico --version
        fi

    - name: Run statico analyze
      id: run
      shell: bash
      env:
        STATICO_PATH: ${{ inputs.path }}
        STATICO_FORMAT: ${{ inputs.format }}
        STATICO_OUTPUT: ${{ inputs.output-file }}
        STATICO_MIN_CONF: ${{ inputs.min-confidence }}
        STATICO_EXIT_CODE: ${{ inputs.exit-code }}
      run: |
        set -euo pipefail
        args=(analyze "$STATICO_PATH" --format "$STATICO_FORMAT" --min-confidence "$STATICO_MIN_CONF")
        if [ "$STATICO_EXIT_CODE" = "true" ]; then
          args+=(--exit-code)
        fi
        statico "${args[@]}" >"$STATICO_OUTPUT"
        echo "output-file=$STATICO_OUTPUT" >>"$GITHUB_OUTPUT"

    - name: Upload SARIF to code scanning
      if: ${{ inputs.upload-sarif == 'true' && inputs.format == 'sarif' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.run.outputs.output-file }}
        category: statico
