name: pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Single in-flight deploy at a time. Don't cancel a running deploy if a new
# one is queued — let it finish, then run the next.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (Angular SSG with /statico/ base-href)
        run: npm run build -- --base-href "/statico/"

      - name: Add .nojekyll and SPA 404 fallback
        run: |
          cd dist/website/browser
          # Stop GitHub Pages' Jekyll pipeline from filtering files starting
          # with underscore (Angular ships a few of those in its asset graph).
          touch .nojekyll
          # GitHub Pages serves 404.html for any path it can't resolve. Copy
          # the SSG-prerendered index so client-side routing fallbacks land
          # on a real Angular shell rather than a Jekyll 404 page.
          if [ ! -f 404.html ] && [ -f index.html ]; then
            cp index.html 404.html
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist/website/browser

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
