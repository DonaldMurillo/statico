name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an in-flight run on the same branch when a newer commit arrives.
# `main` is excluded so we don't kill a finishing run when a follow-up
# commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Install bun (for plugin tests)
        uses: oven-sh/setup-bun@v2

      - name: cargo build
        run: cargo build --all-targets

      - name: cargo test
        run: cargo test --no-fail-fast

      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo fmt --check
        # Formatting is informational on macOS but enforced on Linux so a
        # single canonical platform is the source of truth.
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

  msrv:
    name: MSRV check (1.91)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.91 (declared MSRV)
        uses: dtolnay/rust-toolchain@1.91

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.91

      - name: cargo build
        run: cargo build --all-targets

  self-analyze:
    name: statico analyzes itself
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: self-analyze

      - name: Build release binary
        run: cargo build --release --bin statico

      - name: statico analyze . (baseline-gated)
        # `statico-baseline.json` records the current set of harmless
        # findings on this repo (4 circular deps from the output/mod.rs
        # re-export pattern, 1 from languages/, plus a few duplicate
        # exports and test-helper unused exports). With `--baseline`, only
        # *new* issues above confidence 0.7 fail the build. Regenerate with:
        #   statico analyze . --update-baseline statico-baseline.json
        run: |
          ./target/release/statico analyze . \
            --baseline statico-baseline.json \
            --min-confidence 0.7 \
            --exit-code \
            --format markdown
