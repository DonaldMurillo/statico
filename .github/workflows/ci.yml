name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an in-flight run on the same branch when a newer commit arrives.
# `main` is excluded so we don't kill a finishing run when a follow-up
# commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # `dtolnay/rust-toolchain` doesn't ship clippy/rustfmt by default;
          # opt in here so the cargo clippy / cargo fmt steps below work in
          # a fresh container.
          components: clippy, rustfmt

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Install bun (for plugin tests)
        uses: oven-sh/setup-bun@v2

      - name: cargo build
        run: cargo build --all-targets

      - name: cargo test
        run: cargo test --no-fail-fast

      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo fmt --check
        # Formatting is informational on macOS but enforced on Linux so a
        # single canonical platform is the source of truth.
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Build TS plugin SDK (needed by coverage-gap example)
        # The SDK's package.json points main → dist/index.js, so the
        # coverage-gap plugin can't import it until we build.
        working-directory: sdks/typescript
        run: |
          bun install
          bun run build

      - name: Test the coverage-gap plugin example
        # End-to-end JSON-RPC tests that spawn the plugin and verify the
        # init + analyze_file + post_analysis flow. Bun-only — already
        # installed by the setup-bun step above.
        working-directory: examples/plugins/coverage-gap
        run: |
          bun install
          bun test

  windows-build:
    # Windows is a release target but the test matrix is unix-only because
    # several plugin tests spawn bash mock scripts. This job builds the
    # binary + runs the unit (`--lib`) tests on Windows so build regressions
    # caught at release time get caught at PR time instead.
    name: windows build + lib tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: windows

      - name: cargo build
        run: cargo build --all-targets

      - name: cargo test --lib
        run: cargo test --lib --no-fail-fast

  msrv:
    name: MSRV check (1.91)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.91 (declared MSRV)
        uses: dtolnay/rust-toolchain@1.91

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.91

      - name: cargo build
        run: cargo build --all-targets

  self-analyze:
    name: statico analyzes itself
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: self-analyze

      - name: Build release binary
        run: cargo build --release --bin statico

      - name: statico analyze . (smoke test, baseline-gated, non-failing)
        # Smoke test: this just confirms statico can analyze itself end to end
        # without crashing. We do **not** pass `--exit-code` because the
        # analyzer's circular-dep detection picks a non-deterministic
        # representative cycle inside each strongly-connected component
        # (`output/mod.rs` ↔ all submodules), so the exact cycles reported
        # differ between platforms — the baseline can't suppress what the
        # current run wasn't going to report. Tracked as a follow-up; for
        # now this step prints the analysis and lets CI move on.
        run: |
          ./target/release/statico analyze . \
            --baseline statico-baseline.json \
            --min-confidence 0.7 \
            --format markdown

  sdks:
    # Standalone gate for the two plugin SDKs we publish to crates.io and
    # npm. Verifies tests, manifest sanity (cargo publish --dry-run /
    # npm pack --dry-run), and that the TS build produces the expected
    # dist artifacts. Catches manifest regressions before tagging.
    name: plugin SDKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: sdks
          workspaces: sdks/rust

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      # ─── Rust SDK ──────────────────────────────────────────────────
      - name: rust SDK — cargo test
        working-directory: sdks/rust
        run: cargo test

      - name: rust SDK — cargo clippy
        working-directory: sdks/rust
        run: cargo clippy --all-targets -- -D warnings

      - name: rust SDK — cargo fmt --check
        working-directory: sdks/rust
        run: cargo fmt -- --check

      - name: rust SDK — cargo publish --dry-run
        working-directory: sdks/rust
        run: cargo publish --dry-run

      # ─── TypeScript SDK ────────────────────────────────────────────
      - name: ts SDK — bun install
        working-directory: sdks/typescript
        run: bun install

      - name: ts SDK — typecheck
        working-directory: sdks/typescript
        run: bun run check

      - name: ts SDK — bun test
        working-directory: sdks/typescript
        run: bun test

      - name: ts SDK — build (emits dist/)
        working-directory: sdks/typescript
        run: bun run build

      - name: ts SDK — assert dist artifacts exist
        working-directory: sdks/typescript
        run: |
          set -euo pipefail
          test -f dist/index.js
          test -f dist/index.d.ts
          test -f dist/index.js.map
          test -f dist/index.d.ts.map

      - name: ts SDK — npm pack --dry-run
        working-directory: sdks/typescript
        run: npm pack --dry-run

  website-build:
    # Smoke-build the Angular SSG site so we catch website breakage in CI
    # rather than discovering it the moment the Pages deploy fails. Same
    # `ng build` invocation Pages uses.
    name: website build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: npm ci
        run: npm ci

      - name: ng build (with /statico/ base-href, same as Pages)
        run: npm run build -- --base-href "/statico/"

  hygiene:
    # Lightweight hygiene gate: typos, cargo-deny (advisories + licenses +
    # source allow-list), cargo-machete (unused deps). Each step is fast
    # (~seconds) and adds a real signal that the existing fmt/clippy/test
    # gates don't catch.
    name: hygiene (typos / deny / machete)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: hygiene

      - name: typos
        uses: crate-ci/typos@master

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources bans

      - name: cargo-machete (unused dependencies — advisory)
        # Advisory-only for now: prints unused deps but does not fail the
        # build. Promote to a hard gate once the existing manifests are clean.
        continue-on-error: true
        uses: bnjbvr/cargo-machete@main
