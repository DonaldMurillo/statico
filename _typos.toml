# typos: opt-in code spelling check.
# https://github.com/crate-ci/typos

[files]
extend-exclude = [
    "Cargo.lock",
    "target/",
    "node_modules/",
    "website/dist/",
    "website/.angular/",
    "website/test-results/",
    "fixtures/",
    "benchmarks/",
    "statico-baseline.json",
    "*.snap",
]

[default.extend-words]
# Project / proper nouns
statico = "statico"
oxc = "oxc"
# False positives that show up in TS/Rust ASTs and dependency names
ba = "ba"
fo = "fo"
ot = "ot"
crate = "crate"
# Short loop-variable names used across the issue formatters. Convention is
# to call the iteration variable after the issue type's initials —
# `for ue in &output.issues.unused_exports` etc. They're Rust identifiers,
# not English; suppress here rather than rename across the codebase.
ue = "ue"
nd = "nd"
